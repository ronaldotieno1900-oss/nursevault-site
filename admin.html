  function abCapSource(text){
    const t = String(text || "").replace(/\u0000/g, " ").trim();
    const max = 25000;
    if (t.length > max) return t.slice(0, max);
    return t;
  }

  function abApplySource(text, fileName){
    const ta = document.getElementById("abSource");
    const st = document.getElementById("abStatus");
    const full = String(text || "");
    const capped = abCapSource(full);
    if (!capped) {
      if (st) st.textContent = "No readable text found in " + (fileName || "file") + ".";
      return;
    }
    if (ta) ta.value = capped;
    if (st) {
      st.textContent = "Loaded " + (fileName || "file") +
        (full.length > 25000 ? " (trimmed to 25,000 characters)." : " (" + full.length + " characters).");
    }
  }

  function abLoadScript(src){
    return new Promise(function(resolve, reject){
      const existing = document.querySelector('script[data-ab-src="' + src + '"]');
      if (existing) {
        if (existing.getAttribute("data-ab-ready") === "1") return resolve();
        existing.addEventListener("load", function(){ resolve(); });
        existing.addEventListener("error", function(){ reject(new Error("Failed to load " + src)); });
        return;
      }
      const s = document.createElement("script");
      s.src = src;
      s.async = true;
      s.setAttribute("data-ab-src", src);
      s.onload = function(){ s.setAttribute("data-ab-ready", "1"); resolve(); };
      s.onerror = function(){ reject(new Error("Failed to load " + src)); };
      document.head.appendChild(s);
    });
  }

  async function abExtractPdf(arrayBuffer){
    // pdf.js from cdnjs
    await abLoadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
    const pdfjsLib = window["pdfjs-dist/build/pdf"] || window.pdfjsLib;
    if (!pdfjsLib) throw new Error("PDF library not available");
    pdfjsLib.GlobalWorkerOptions.workerSrc =
      "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
    const doc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    const maxPages = Math.min(doc.numPages, 40);
    const parts = [];
    for (let p = 1; p <= maxPages; p++) {
      const page = await doc.getPage(p);
      const content = await page.getTextContent();
      const line = (content.items || []).map(function(it){ return it.str || ""; }).join(" ");
      if (line.trim()) parts.push(line.trim());
    }
    return parts.join("\n\n");
  }

  async function abExtractDocx(arrayBuffer){
    await abLoadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js");
    if (!window.mammoth) throw new Error("Word library not available");
    const result = await window.mammoth.extractRawText({ arrayBuffer: arrayBuffer });
    return (result && result.value) || "";
  }

  async function abExtractPptx(arrayBuffer){
    await abLoadScript("https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js");
    if (!window.JSZip) throw new Error("ZIP library not available for PowerPoint");
    const zip = await window.JSZip.loadAsync(arrayBuffer);
    const slideNames = Object.keys(zip.files)
      .filter(function(n){ return /^ppt\/slides\/slide\d+\.xml$/i.test(n); })
      .sort(function(a, b){
        const na = parseInt((a.match(/slide(\d+)/i) || [])[1] || "0", 10);
        const nb = parseInt((b.match(/slide(\d+)/i) || [])[1] || "0", 10);
        return na - nb;
      });
    if (!slideNames.length) throw new Error("No slides found in this PowerPoint file");
    const parts = [];
    for (let s = 0; s < slideNames.length; s++) {
      const xml = await zip.files[slideNames[s]].async("string");
      // Extract text from a:t nodes (DrawingML text runs)
      const texts = [];
      const re = /<a:t(?:>|\s[^>]*>)([\s\S]*?)<\/a:t>/gi;
      let m;
      while ((m = re.exec(xml)) !== null) {
        const piece = String(m[1] || "")
          .replace(/&amp;/g, "&")
          .replace(/&lt;/g, "<")
          .replace(/&gt;/g, ">")
          .replace(/&quot;/g, '"')
          .replace(/&#39;/g, "'")
          .trim();
        if (piece) texts.push(piece);
      }
      if (texts.length) {
        parts.push("Slide " + (s + 1) + ":\n" + texts.join(" "));
      }
    }
    const out = parts.join("\n\n").trim();
    if (!out) throw new Error("No readable text in this PowerPoint (may be image-only slides)");
    return out;
  }


  async function abLoadFile(input){
    const file = input && input.files && input.files[0];
    const st = document.getElementById("abStatus");
    if (!file) return;
    const name = (file.name || "").toLowerCase();
    if (/\.(xlsx?|zip|png|jpe?g|gif|webp)$/i.test(name) || (/\.ppt$/i.test(name) && !/\.pptx$/i.test(name))) {
      if (st) st.textContent = "Unsupported type. Use .txt, .md, .pdf, .docx, or .pptx.";
      input.value = "";
      return;
    }
    // Allow larger binaries (PDF/DOCX) but still cap extracted text
    if (file.size > 12 * 1024 * 1024) {
      if (st) st.textContent = "File too large (max about 12 MB).";
      input.value = "";
      return;
    }
    if (st) st.textContent = "Reading " + file.name + "…";
    try {
      if (/\.pdf$/i.test(name) || file.type === "application/pdf") {
        const buf = await file.arrayBuffer();
        if (st) st.textContent = "Extracting text from PDF…";
        const text = await abExtractPdf(buf);
        abApplySource(text, file.name);
      } else if (/\.docx$/i.test(name) || /wordprocessingml/.test(file.type || "")) {
        const buf = await file.arrayBuffer();
        if (st) st.textContent = "Extracting text from Word…";
        const text = await abExtractDocx(buf);
        abApplySource(text, file.name);
      } else if (/\.pptx$/i.test(name) || /presentationml\.presentation/.test(file.type || "")) {
        const buf = await file.arrayBuffer();
        if (st) st.textContent = "Extracting text from PowerPoint…";
        const text = await abExtractPptx(buf);
        abApplySource(text, file.name);
      } else if (/\.ppt$/i.test(name) && !/\.pptx$/i.test(name)) {
        if (st) st.textContent = "Old .ppt format is not supported. Save as .pptx or export text/PDF, or paste the text.";
        input.value = "";
      } else if (/\.doc$/i.test(name)) {
        if (st) st.textContent = "Old .doc format is not supported. Save as .docx or .txt, or paste the text.";
        input.value = "";
      } else {
        // plain text family
        const text = await new Promise(function(resolve, reject){
          const reader = new FileReader();
          reader.onload = function(){ resolve(String(reader.result || "")); };
          reader.onerror = function(){ reject(new Error("read failed")); };
          reader.readAsText(file);
        });
        abApplySource(text, file.name);
      }
    } catch (e) {
      if (st) st.textContent = "Could not read " + file.name + ": " + (e && e.message ? e.message : "error") +
        ". Try exporting as .txt or paste the text.";
    }
    input.value = "";
  }


  function abSourceFingerprint(text) {
    const t = String(text || "").toLowerCase().replace(/\s+/g, " ").trim().slice(0, 400);
    let h = 0;
    for (let i = 0; i < t.length; i++) h = ((h << 5) - h + t.charCodeAt(i)) | 0;
    return "src_" + (h >>> 0).toString(16);
  }

  function abNormalizeStem(s) {
    return String(s || "")
      .toLowerCase()
      .replace(/[^a-z0-9\s]/g, " ")
      .replace(/\b(the|a|an|patient|nurse|which|what|when|where|how|most|first|priority|appropriate|following)\b/g, " ")
      .replace(/\s+/g, " ")
      .trim()
      .slice(0, 160);
  }

  function abLoadAvoidForSource(source) {
    try {
      const key = "nv_avoid_" + abSourceFingerprint(source);
      const raw = localStorage.getItem(key);
      const arr = raw ? JSON.parse(raw) : [];
      return Array.isArray(arr) ? arr.filter(function (x) { return typeof x === "string" && x.length > 15; }).slice(-120) : [];
    } catch (e) { return []; }
  }

  function abSaveAvoidForSource(source, stems) {
    try {
      const key = "nv_avoid_" + abSourceFingerprint(source);
      const normSeen = {};
      const out = [];
      (stems || []).forEach(function (s) {
        const n = abNormalizeStem(s);
        if (!n || n.length < 12) return;
        if (normSeen[n]) return;
        normSeen[n] = 1;
        out.push(String(s).trim().slice(0, 200));
      });
      localStorage.setItem(key, JSON.stringify(out.slice(-120)));
      abState.avoidStems = out.slice(-120);
    } catch (e) {}
  }

  async function abGenerate(){
    const key = abGetKey();
    if (!key) { renderAdminBank(); return; }
    abSaveForm();
    const source = (document.getElementById("abSource") || {}).value || "";
    const cadre = (document.getElementById("abCadre") || {}).value || "KRCHN";
    const topic = (document.getElementById("abTopic") || {}).value || "General";
    const group = (document.getElementById("abGroup") || {}).value || "General";
    const count = parseInt((document.getElementById("abCount") || {}).value || "8", 10);
    const st = document.getElementById("abStatus");
    const busy = document.getElementById("abBusy");
    const btn = document.getElementById("abGenBtn");
    if (source.trim().length < 80) {
      if (st) st.textContent = "Paste a longer source passage first.";
      return;
    }
    if (btn) { btn.disabled = true; btn.textContent = "Generating…"; }
    if (st) st.textContent = "";
    if (busy) {
      busy.style.display = "block";
      busy.textContent = "Generating " + count + " questions — often 30–90 seconds. Please wait…";
    }
    const started = Date.now();
    const tick = setInterval(() => {
      if (!busy) return;
      const s = Math.round((Date.now() - started) / 1000);
      busy.textContent = "Generating " + count + " questions… " + s + "s elapsed. Keep this tab open.";
    }, 1000);
    try {
      const res = await fetch(NCK_EXPLAIN_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + key
        },
        body: JSON.stringify({
          mode: "generate-mcq",
          sourceText: source,
          cadre, topic, group, count,
          avoidStems: (function () {
            const fromStore = abLoadAvoidForSource(source);
            const fromDrafts = (abState.questions || []).map(function (q) { return q && q.q; }).filter(Boolean);
            const fromMem = Array.isArray(abState.avoidStems) ? abState.avoidStems : [];
            const all = fromStore.concat(fromDrafts).concat(fromMem);
            const seen = {};
            const out = [];
            for (let i = 0; i < all.length; i++) {
              const s = String(all[i] || "").trim();
              if (s.length < 15) continue;
              const k = abNormalizeStem(s);
              if (!k || seen[k]) continue;
              seen[k] = 1;
              out.push(s);
              if (out.length >= 80) break;
            }
            return out;
          })()
        })
      });
      const data = await res.json().catch(() => ({}));
      clearInterval(tick);
      if (!res.ok) {
        abState.status = (data.error || ("Request failed (" + res.status + ")")) +
          (data.detail ? (" — " + String(data.detail).slice(0, 160)) : "") +
          " Tip: if it fails, retry or shorten the source.";
        if (typeof abLogError === "function") abLogError(abState.status, data.detail || "", "generate-mcq");
        if (busy) busy.style.display = "none";
        if (btn) { btn.disabled = false; btn.textContent = "Generate questions"; }
        if (st) st.textContent = abState.status;
        return;
      }
      const list = Array.isArray(data.questions) ? data.questions : [];
      abState.questions = list.map(q => Object.assign({}, q, {
        _status: "pending",
        topic: q.topic || topic,
        group: q.group || group,
        cadre: q.cadre || cadre
      }));
      // Persist stems for this source (survives refresh) so repeats are blocked
      const prev = abLoadAvoidForSource(source);
      const merged = prev.concat(list.map(function (q) { return q && q.q; }).filter(Boolean));
      abSaveAvoidForSource(source, merged);
      const dropped = data.droppedByVerifier != null ? data.droppedByVerifier : 0;
      const vs = data.verifier || (data.verified ? "ran" : "");
      const why = data.stats && data.stats.dropped ? Object.keys(data.stats.dropped).map(function (k) { return k + " " + data.stats.dropped[k]; }).join(", ") : "";
      const verNote =
        vs === "ran" ? (dropped > 0 ? (" Verifier removed " + dropped + " weak item(s).") : " Verifier passed.")
        : vs === "partial" ? " Some candidates failed to complete every check and were discarded; review any flags on returned drafts."
        : vs === "unavailable" ? " The independent verifier was unavailable, so no draft was cleared. Retry when the verifier is available."
        : vs === "skipped" ? " Verifier skipped."
        : "";
      const whyNote = why ? (" Filtered: " + why + ".") : "";
      const repNote = (data.stats && data.stats.repaired) ? (" Auto-rewrote " + data.stats.repaired + " weak item(s).") : "";
      const shortNote = (data.requested && list.length < data.requested) ? (" Asked for " + data.requested + ", " + list.length + " passed the checks.") : "";
      const tk = data.stats && data.stats.tokens ? data.stats.tokens : null;
      const tokNote = tk ? (" Used " + (tk.input + tk.output).toLocaleString() + " tokens (" + tk.input.toLocaleString() + " in, " + tk.output.toLocaleString() + " out) over " + (data.stats.modelCalls || 0) + " model calls.") : "";
      const detNote = (data.detail && list.length < (data.requested || 0)) ? (" " + data.detail) : "";
      const avoidN = abLoadAvoidForSource(source).length;
      abState.status = list.length
        ? ("Drafted " + list.length + " in " + Math.round((Date.now() - started) / 1000) + "s." + verNote +
           " Avoiding " + avoidN + " prior stem(s) for this source." + shortNote + repNote + whyNote + tokNote + detNote + " Review below.")
        : ("No questions returned." + verNote + whyNote + detNote + tokNote + " Open the browser console or send me the 'Filtered' list above if this keeps happening.");
      renderAdminBank();
    } catch (e) {
      clearInterval(tick);
      abState.status = "Could not reach the AI Worker.";
      if (typeof abLogError === "function") abLogError(abState.status, String(e && e.message || e), "generate-mcq");
      if (busy) busy.style.display = "none";
      if (btn) { btn.disabled = false; btn.textContent = "Generate questions"; }
      if (st) st.textContent = abState.status;
    }
  }



  // Boot
  document.addEventListener("DOMContentLoaded", function () {
    try { openAdminBankPage(); } catch (e) { console.error(e); }
  });
  </script>
<script id="px-module">
/* =====================================================================
   PAPER EXTRACTOR tab (separate from the Question builder / generator).
   Upload a past paper -> read the questions -> two independent AI passes choose the answer
   -> explanation written and audited -> you review the flagged ones -> publish as a Past paper.
   ===================================================================== */
const PX_SAVE = "nv_px_draft_v1";
const PX_POS_RE = /\b(option|choice|answer)\s+\(?[a-f1-4]\)?\b|\b(first|second|third|fourth|last)\s+(option|choice|answer)\b|\b[A-D]\s+is\s+(correct|wrong|incorrect)\b|\(\s*[A-D]\s*\)/i;
function pxFresh(){
  return {
    paper: { title: "", year: "", cadre: "KRCHN", minutes: "", access: "paid" },
    tier: "standard", improve: "off", text: "", fileNotes: [], items: [], key: {},
    chunkDone: 0, chunkTotal: 0, textSig: "", extractDone: false,
    running: false, stop: false, stage: "", stageDone: 0, stageTotal: 0,
    log: [], usage: { inT: 0, outT: 0, calls: 0 }, filter: "review", page: 0,
    published: null, restored: false, edit: {}, busy: {}
  };
}
let pxS = pxFresh();
(function pxLoad(){
  try {
    const raw = localStorage.getItem(PX_SAVE);
    if (!raw) return;
    const o = JSON.parse(raw);
    if (o && typeof o === "object") {
      pxS = Object.assign(pxFresh(), o, { running: false, stop: false, edit: {}, busy: {}, stage: "", restored: !!(o.items && o.items.length) });
    }
  } catch (e) {}
})();
function pxSave(){
  const o = Object.assign({}, pxS);
  delete o.running; delete o.stop; delete o.edit; delete o.busy;
  try { localStorage.setItem(PX_SAVE, JSON.stringify(o)); }
  catch (e) { try { o.text = ""; localStorage.setItem(PX_SAVE, JSON.stringify(o)); } catch (e2) {} }
}
function pxL(i){ return String.fromCharCode(65 + i); }
function pxNorm(s){ return String(s == null ? "" : s).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
function pxSig(t){ t = String(t || ""); return t.length + ":" + t.slice(0, 60); }
function pxLog(msg){ pxS.log.push(new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) + "  " + msg); if (pxS.log.length > 40) pxS.log.shift(); pxRenderProg(); }
function pxStage(label, done, total){ pxS.stage = label; pxS.stageDone = done; pxS.stageTotal = total; pxRenderProg(); }
const pxSleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------- reading files (keeps line breaks, which the PDF reader in the generator does not) ---------- */
async function pxExtractPdf(buf){
  await abLoadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  const lib = window["pdfjs-dist/build/pdf"] || window.pdfjsLib;
  if (!lib) throw new Error("PDF library not available");
  lib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const doc = await lib.getDocument({ data: buf }).promise;
  const pages = Math.min(doc.numPages, 80), out = [];
  for (let p = 1; p <= pages; p++) {
    const page = await doc.getPage(p);
    const content = await page.getTextContent();
    const items = (content.items || []).filter((it) => it && typeof it.str === "string" && it.transform);
    items.sort((a, b) => (b.transform[5] - a.transform[5]) || (a.transform[4] - b.transform[4]));
    const lines = []; let cur = null;
    items.forEach((it) => {
      const y = it.transform[5], tol = Math.max(3, (it.height || 8) * 0.5);
      if (!cur || Math.abs(cur.y - y) > tol) { cur = { y, parts: [] }; lines.push(cur); }
      cur.parts.push(it);
    });
    const text = lines.map((ln) => {
      ln.parts.sort((a, b) => a.transform[4] - b.transform[4]);
      let s = "", prevEnd = null;
      ln.parts.forEach((it) => {
        const x = it.transform[4];
        if (prevEnd != null && x - prevEnd > 1.2 && s && !/\s$/.test(s) && !/^\s/.test(it.str)) s += " ";
        s += it.str; prevEnd = x + (it.width || 0);
      });
      return s.replace(/\s+$/, "");
    }).filter((s) => s.trim()).join("\n");
    out.push(text);
  }
  return { text: out.join("\n\n"), pages };
}
async function pxOnFiles(input){
  const files = Array.from((input && input.files) || []);
  const st = document.getElementById("pxFileStatus");
  if (!files.length) return;
  let added = "";
  for (const f of files) {
    try {
      if (st) st.textContent = "Reading " + f.name + "…";
      const name = f.name.toLowerCase();
      let text = "", note = "";
      if (name.endsWith(".pdf")) {
        const r = await pxExtractPdf(await f.arrayBuffer());
        text = r.text;
        note = f.name + ": " + r.pages + " pages, " + text.length + " characters";
        if (text.replace(/\s/g, "").length < r.pages * 150) note += " — very little text found. This looks like a scanned paper (images). Scanned papers need OCR first; paste the text instead.";
      } else if (name.endsWith(".docx")) {
        text = await abExtractDocx(await f.arrayBuffer());
        note = f.name + ": " + text.length + " characters";
      } else {
        text = await f.text();
        note = f.name + ": " + text.length + " characters";
      }
      added += "\n\n----- " + f.name + " -----\n\n" + text;
      pxS.fileNotes.push(note);
    } catch (e) {
      pxS.fileNotes.push(f.name + ": could not be read (" + (e && e.message ? e.message : "error") + ")");
    }
  }
  pxS.text = (pxS.text + added).slice(0, 600000);
  input.value = "";
  const ta = document.getElementById("pxText"); if (ta) ta.value = pxS.text;
  if (st) st.innerHTML = pxS.fileNotes.slice(-4).map(abEsc).join("<br>");
  pxSave();
}

/* ---------- splitting into parts that start at question boundaries ---------- */
function pxChunks(text){
  const lines = String(text || "").replace(/\r/g, "").split("\n");
  const startRe = /^\s*(?:Q(?:uestion)?\.?\s*)?\d{1,3}\s*[.)]\s*\S/i;
  const TARGET = 5500, HARD = 9000, chunks = [];
  let cur = [], len = 0;
  const flush = () => { const t = cur.join("\n"); if (t.trim()) chunks.push(t); cur = []; len = 0; };
  for (const ln of lines) {
    if (len >= TARGET && startRe.test(ln)) flush();
    else if (len >= HARD) flush();
    cur.push(ln); len += ln.length + 1;
  }
  flush();
  return chunks;
}

/* ---------- calling the AI worker ---------- */
async function pxCall(body){
  const key = abGetKey();
  const url = String(NCK_EXPLAIN_URL || "").replace(/\/$/, "");
  let lastErr = "";
  for (let attempt = 1; attempt <= 3; attempt++) {
    if (attempt > 1) await pxSleep(1500 * attempt);
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 120000);
    try {
      const res = await fetch(url, {
        method: "POST", signal: ctl.signal,
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
        body: JSON.stringify(Object.assign({ tier: pxS.tier }, body))
      });
      const data = await res.json().catch(() => ({}));
      clearTimeout(timer);
      if (res.status === 401) { const e = new Error("Admin key was not accepted. Lock and unlock again."); e.fatal = true; throw e; }
      if (res.ok && data && data.ok !== false) {
        if (data.usage) { pxS.usage.inT += data.usage.in || 0; pxS.usage.outT += data.usage.out || 0; pxS.usage.calls += data.usage.calls || 0; }
        return data;
      }
      lastErr = (data && data.error) || ("HTTP " + res.status);
      if (res.status === 400) break;
    } catch (e) {
      clearTimeout(timer);
      if (e && e.fatal) throw e;
      lastErr = e && e.name === "AbortError" ? "timed out" : (e && e.message) || "network error";
    }
  }
  throw new Error(lastErr || "failed");
}

/* ---------- step 1: read the questions ---------- */
function pxAddQuestion(q){
  const sig = pxNorm(q.q) + "|" + pxNorm((q.options || []).join("|"));
  const at = pxS.items.findIndex((x) => x.sig === sig);
  const it = {
    sig, n: q.n, q: q.q, options: q.options, keyGiven: q.keyGiven, needsFigure: !!q.needsFigure, incomplete: !!q.incomplete,
    figureOk: false, a1: null, a2: null, answer: -1, answerSource: "", topic: "", level: "",
    explanation: "", audit: null, disagree: "", posWords: false, status: "new", risk: []
  };
  if (at >= 0) { if (pxS.items[at].incomplete && !it.incomplete) pxS.items[at] = it; return; }
  pxS.items.push(it);
}
function pxApplyKey(){
  const keys = Object.keys(pxS.key || {});
  if (!keys.length) return;
  const seen = new Set(); let dup = false;
  pxS.items.forEach((it) => { if (it.n != null) { if (seen.has(it.n)) dup = true; seen.add(it.n); } });
  if (dup) { pxLog("Question numbers repeat (more than one paper in the file?), so the answer key was NOT applied automatically."); return; }
  let used = 0;
  pxS.items.forEach((it) => {
    const L = pxS.key[String(it.n)];
    if (!it.keyGiven && L && L.charCodeAt(0) - 65 < it.options.length) { it.keyGiven = L; used++; }
  });
  pxLog("Answer key found for " + used + " questions. The AI will still check it.");
}
async function pxStageExtract(){
  const sig = pxSig(pxS.text);
  if (sig !== pxS.textSig) { pxS.items = []; pxS.key = {}; pxS.chunkDone = 0; pxS.extractDone = false; pxS.textSig = sig; }
  const chunks = pxChunks(pxS.text);
  pxS.chunkTotal = chunks.length;
  pxStage("Reading the questions", pxS.chunkDone, chunks.length);
  for (let c = pxS.chunkDone; c < chunks.length; c++) {
    if (pxS.stop) return;
    let d;
    try { d = await pxCall({ mode: "paper-extract", text: chunks[c] }); }
    catch (e) { if (e.fatal) throw e; pxLog("Part " + (c + 1) + " of " + chunks.length + " could not be read (" + e.message + "). Press Continue to retry."); return; }
    (d.questions || []).forEach(pxAddQuestion);
    Object.assign(pxS.key, d.answerKey || {});
    pxS.chunkDone = c + 1;
    pxStage("Reading the questions", c + 1, chunks.length);
    pxLog("Part " + (c + 1) + "/" + chunks.length + ": " + (d.questions || []).length + " questions found (total " + pxS.items.length + ")");
    pxSave(); pxRenderReview();
  }
  pxApplyKey();
  pxS.extractDone = true;
  pxS.items.forEach(pxDecide);
  pxSave();
}

/* ---------- step 2: choose the answer (two independent passes) ---------- */
function pxNeedsAnswer(it){
  if (it.status === "rejected" || it.needsFigure || it.options.length < 2 || it.answerSource === "manual") return false;
  const needTwo = !it.keyGiven;
  return !it.a1 || (needTwo && !it.a2);
}
async function pxStageAnswer(){
  const todo = []; pxS.items.forEach((it, i) => { if (pxNeedsAnswer(it)) todo.push(i); });
  const topics = abTopicList();
  let done = 0; pxStage("Choosing the correct answers (two passes)", 0, todo.length);
  for (let b = 0; b < todo.length; b += 6) {
    if (pxS.stop) return;
    const batch = todo.slice(b, b + 6);
    const send = (pass) => {
      const idxs = batch.filter((i) => pass === 1 ? !pxS.items[i].a1 : (!pxS.items[i].keyGiven && !pxS.items[i].a2));
      if (!idxs.length) return Promise.resolve(null);
      return pxCall({ mode: "paper-answer", pass, topics: pass === 1 ? topics : undefined,
        items: idxs.map((i) => ({ i, q: pxS.items[i].q, options: pxS.items[i].options })) });
    };
    const rs = await Promise.allSettled([send(1), send(2)]);
    rs.forEach((r, k) => {
      if (r.status === "rejected") { if (r.reason && r.reason.fatal) throw r.reason; pxLog("Answer pass " + (k + 1) + " failed for one group (" + (r.reason && r.reason.message) + "). Press Continue to retry."); return; }
      if (!r.value) return;
      (r.value.results || []).forEach((x) => {
        const it = pxS.items[x.i]; if (!it || !x.ok) return;
        it["a" + (k + 1)] = { pick: x.pick, confidence: x.confidence, flags: x.flags || [], note: x.note || "", topic: x.topic || "", level: x.level || "" };
        if (k === 0) { if (!it.topic && x.topic && x.topic !== "Other") it.topic = x.topic; if (!it.level && x.level) it.level = x.level; }
      });
    });
    batch.forEach((i) => pxDecide(pxS.items[i]));
    done += batch.length; pxStage("Choosing the correct answers (two passes)", done, todo.length);
    pxSave(); pxRenderReview();
  }
}

/* ---------- step 3: explanation + audit ---------- */
function pxNeedsExplain(it){
  return it.status !== "rejected" && !it.needsFigure && it.answer >= 0 && it.options.length === 4 && !it.explanation && !it.disagree;
}
async function pxStageExplain(){
  const todo = []; pxS.items.forEach((it, i) => { if (pxNeedsExplain(it)) todo.push(i); });
  let done = 0; pxStage("Writing and checking explanations", 0, todo.length);
  for (let b = 0; b < todo.length; b += 4) {
    if (pxS.stop) return;
    const batch = todo.slice(b, b + 4);
    try {
      const d = await pxCall({ mode: "paper-explain", items: batch.map((i) => ({ i, q: pxS.items[i].q, options: pxS.items[i].options, answer: pxS.items[i].answer })) });
      pxApplyExplain(d);
    } catch (e) { if (e.fatal) throw e; pxLog("Explanations failed for one group (" + e.message + "). Press Continue to retry."); }
    batch.forEach((i) => pxDecide(pxS.items[i]));
    done += batch.length; pxStage("Writing and checking explanations", done, todo.length);
    pxSave(); pxRenderReview();
  }
}
function pxApplyExplain(d){
  (d.results || []).forEach((x) => {
    const it = pxS.items[x.i]; if (!it) return;
    if (x.disagree) { it.disagree = x.reason || "The explainer believes the chosen answer is wrong."; return; }
    if (!x.ok) return;
    it.explanation = x.explanation; it.audit = x.audit || null; it.posWords = !!x.positionWords; it.disagree = "";
  });
}
async function pxExplainOne(i){
  const it = pxS.items[i];
  if (!it || it.answer < 0 || it.options.length !== 4) return;
  pxS.busy[i] = true; pxRenderReview();
  try {
    it.disagree = "";
    pxApplyExplain(await pxCall({ mode: "paper-explain", items: [{ i, q: it.q, options: it.options, answer: it.answer }] }));
  } catch (e) { pxLog("Could not write the explanation for #" + (i + 1) + ": " + e.message); }
  delete pxS.busy[i]; pxDecide(it); pxSave(); pxRenderReview();
}


/* ---------- optional: better wording (checked by an independent blind answer before it is offered) ---------- */
function pxNeedsImprove(it){
  return it.status !== "rejected" && !it.needsFigure && it.answer >= 0 && it.options.length === 4 && !it.proposal && !it.improved && !it.noImprove && !it.proposalErr;
}
function pxApplyImprove(d){
  (d.results || []).forEach((x) => {
    const it = pxS.items[x.i]; if (!it) return;
    if (x.ok) { it.proposal = { q: x.q, options: x.options, note: x.note || "" }; it.proposalErr = ""; }
    else it.proposalErr = x.unchanged ? "Wording is already good." : ("No safe rewrite: " + (x.reason || "failed"));
  });
}
function pxAcceptProposal(i, auto){
  const it = pxS.items[i]; if (!it || !it.proposal) return;
  if (!it.orig) it.orig = { q: it.q, options: it.options.slice() };
  it.q = it.proposal.q; it.options = it.proposal.options.slice(); it.proposal = null; it.improved = true;
  it.explanation = ""; it.audit = null; it.disagree = ""; it.posWords = false;
  if (it.status === "approved") it.status = "review";
  pxDecide(it); pxSave();
  if (!auto) { pxRenderReview(); pxExplainOne(i); }
}
function pxDiscardProposal(i){ const it = pxS.items[i]; if (it) { it.proposal = null; it.noImprove = true; pxSave(); pxRenderReview(); } }
function pxRevertWording(i){
  const it = pxS.items[i]; if (!it || !it.orig) return;
  it.q = it.orig.q; it.options = it.orig.options.slice(); it.orig = null; it.improved = false; it.noImprove = true;
  it.explanation = ""; it.audit = null; it.posWords = false;
  if (it.status === "approved") it.status = "review";
  pxDecide(it); pxSave(); pxRenderReview(); pxExplainOne(i);
}
async function pxImproveOne(i){
  const it = pxS.items[i]; if (!it || it.answer < 0 || it.options.length !== 4) return;
  pxS.busy[i] = true; it.proposalErr = ""; it.noImprove = false; pxRenderReview();
  try { pxApplyImprove(await pxCall({ mode: "paper-improve", items: [{ i, q: it.q, options: it.options, answer: it.answer }] })); }
  catch (e) { it.proposalErr = "Could not check the wording: " + e.message; }
  delete pxS.busy[i]; pxSave(); pxRenderReview();
}
async function pxStageImprove(){
  const todo = []; pxS.items.forEach((it, i) => { if (pxNeedsImprove(it)) todo.push(i); });
  let done = 0; pxStage("Improving the wording (and checking nothing changed)", 0, todo.length);
  for (let b = 0; b < todo.length; b += 4) {
    if (pxS.stop) return;
    const batch = todo.slice(b, b + 4);
    try {
      pxApplyImprove(await pxCall({ mode: "paper-improve", items: batch.map((i) => ({ i, q: pxS.items[i].q, options: pxS.items[i].options, answer: pxS.items[i].answer })) }));
      if (pxS.improve === "apply") batch.forEach((i) => pxAcceptProposal(i, true));
    } catch (e) { if (e.fatal) throw e; pxLog("Wording check failed for one group (" + e.message + "). Press Continue to retry."); }
    done += batch.length; pxStage("Improving the wording (and checking nothing changed)", done, todo.length);
    pxSave(); pxRenderReview();
  }
}
function pxAcceptAll(){
  const n = pxS.items.filter((it) => it.proposal).length;
  if (!n || pxS.running) return;
  if (!confirm("Accept all " + n + " suggested rewrites? Each already passed the meaning check. Explanations will be rewritten to match.")) return;
  pxS.items.forEach((it, i) => { if (it.proposal) pxAcceptProposal(i, true); });
  pxRun();
}

/* ---------- deciding the answer and the risk flags ---------- */
function pxDecide(it){
  const risk = [];
  const k = it.keyGiven ? it.keyGiven.charCodeAt(0) - 65 : -1;
  const keyOk = k >= 0 && k < it.options.length;
  const p1 = it.a1, p2 = it.a2;
  let ai = null;
  if (p1 && p1.pick != null) { if (keyOk) ai = p1.pick; else if (p2 && p2.pick != null && p2.pick === p1.pick) ai = p1.pick; }
  const manual = it.answerSource === "manual";
  if (!manual) {
    if (keyOk) {
      it.answer = k; it.answerSource = "key";
      if (ai != null && ai !== k) risk.push("The paper's own key says " + pxL(k) + " but the AI chose " + pxL(ai) + ". Check which is right.");
    } else if (ai != null) { it.answer = ai; it.answerSource = "ai"; }
    else {
      it.answer = -1; it.answerSource = "";
      if (p1 && p2) risk.push("The two AI passes disagreed (" + (p1.pick == null ? "none" : pxL(p1.pick)) + " and " + (p2.pick == null ? "none" : pxL(p2.pick)) + "). Choose the answer yourself.");
    }
    const confs = [p1, p2].filter(Boolean).map((p) => p.confidence);
    if (confs.length && Math.min.apply(null, confs) < 75) risk.push("Low AI confidence (" + Math.min.apply(null, confs) + "%).");
    const flags = Array.from(new Set([].concat(p1 ? p1.flags : [], p2 ? p2.flags : [])));
    if (flags.length) risk.push("AI flags: " + flags.join(", ") + ".");
  }
  if (it.needsFigure && !it.figureOk) risk.push("Needs a figure or table that is not in the text.");
  if (it.incomplete) risk.push("Looks cut off. Check the text against the paper.");
  if (it.options.length !== 4) risk.push("Has " + it.options.length + " options; the site needs exactly 4.");
  if (new Set(it.options.map(pxNorm)).size < it.options.length) risk.push("Two options are identical.");
  if (it.disagree) risk.push("The explainer thinks the chosen answer is wrong: " + it.disagree);
  if (it.audit && !it.audit.ok) risk.push("Audit: " + ((it.audit.issues || []).join(" ") || "not approved."));
  if (it.explanation && it.posWords) risk.push("The explanation mentions an option by letter or position. Edit it.");
  it.risk = risk;
  if (it.status !== "approved" && it.status !== "rejected") it.status = risk.length ? "review" : (it.explanation ? "clean" : "new");
}
function pxBlockers(it){
  const b = [];
  if (it.answer < 0) b.push("choose the correct answer");
  if (it.options.length !== 4) b.push("needs exactly 4 options");
  else if (new Set(it.options.map(pxNorm)).size < 4) b.push("options must be different");
  if (it.needsFigure && !it.figureOk) b.push("needs a figure (tick the box if the text is enough)");
  if (!it.explanation || it.explanation.trim().length < 40) b.push("needs an explanation");
  return b;
}

/* ---------- running ---------- */
async function pxRun(){
  if (pxS.running) return;
  pxReadForm();
  if (!abGetKey()) { pxLog("Unlock the admin first."); return; }
  if (!pxS.items.length && pxS.text.replace(/\s/g, "").length < 40) { pxLog("Upload a paper or paste its text first."); return; }
  if (pxS.items.length && pxSig(pxS.text) !== pxS.textSig && pxS.text.replace(/\s/g, "").length >= 40 && !confirm("The paper text changed. Starting again will replace the " + pxS.items.length + " questions below. Continue?")) return;
  pxS.running = true; pxS.stop = false; pxS.restored = false; pxRenderAll();
  try {
    if (pxS.text.replace(/\s/g, "").length >= 40 || !pxS.extractDone) { if (!pxS.extractDone || pxSig(pxS.text) !== pxS.textSig) await pxStageExtract(); }
    if (!pxS.stop && pxS.extractDone) await pxStageAnswer();
    if (!pxS.stop && pxS.extractDone && pxS.improve !== "off") await pxStageImprove();
    if (!pxS.stop && pxS.extractDone) await pxStageExplain();
    pxS.items.forEach(pxDecide);
    if (pxS.stop) pxLog("Stopped. Everything so far is saved. Press Continue to carry on.");
    else if (pxS.extractDone) {
      const left = pxS.items.filter((it) => pxNeedsAnswer(it) || pxNeedsExplain(it) || (pxS.improve !== "off" && pxNeedsImprove(it))).length;
      pxLog(left ? left + " questions still need an answer or explanation. Press Continue to retry them." : "Done. Review the flagged questions, then publish.");
    }
  } catch (e) { pxLog("Stopped: " + (e && e.message ? e.message : "error")); }
  pxS.running = false; pxS.stage = ""; pxSave(); pxRenderAll();
}
function pxStop(){ if (pxS.running) { pxS.stop = true; pxLog("Stopping after the current step…"); } }
function pxClear(){
  if (pxS.running) return;
  if (pxS.items.length && !confirm("Clear this paper and all " + pxS.items.length + " questions? Publish or download first if you want to keep them.")) return;
  pxS = pxFresh(); try { localStorage.removeItem(PX_SAVE); } catch (e) {}
  renderAdminBank();
}
function pxReadForm(){
  const v = (id) => { const el = document.getElementById(id); return el ? el.value : null; };
  const t = v("pxTitle"); if (t != null) pxS.paper.title = t.trim();
  const y = v("pxYear"); if (y != null) pxS.paper.year = y.trim();
  const c = v("pxCadre"); if (c != null) pxS.paper.cadre = c;
  const m = v("pxMin"); if (m != null) pxS.paper.minutes = m.trim();
  const a = v("pxAccess"); if (a != null) pxS.paper.access = a;
  const tr = v("pxTier"); if (tr != null) pxS.tier = tr;
  const im = v("pxImprove"); if (im != null) pxS.improve = im;
  const tx = v("pxText"); if (tx != null) pxS.text = tx;
}

/* ---------- review actions ---------- */
function pxSetAns(i, k){
  const it = pxS.items[i]; if (!it || k >= it.options.length) return;
  if (it.answer === k && it.answerSource === "manual") return;
  it.answer = k; it.answerSource = "manual";
  it.explanation = ""; it.audit = null; it.disagree = ""; it.posWords = false;
  if (it.status === "approved") it.status = "review";
  pxDecide(it); pxSave(); pxRenderReview();
  if (it.options.length === 4) pxExplainOne(i);
}
function pxSetTopic(i, v){ const it = pxS.items[i]; if (it) { it.topic = v; pxSave(); } }
function pxSetLevel(i, v){ const it = pxS.items[i]; if (it) { it.level = v; pxSave(); } }
function pxSetExpl(i, v){ const it = pxS.items[i]; if (it) { it.explanation = v; pxSave(); } }
function pxExplDone(i){
  const it = pxS.items[i]; if (!it) return;
  it.posWords = PX_POS_RE.test(it.explanation || ""); pxDecide(it); pxSave(); pxRenderReview();
}
function pxFigureOk(i, on){ const it = pxS.items[i]; if (it) { it.figureOk = !!on; pxDecide(it); pxSave(); pxRenderReview(); } }
function pxToggleEdit(i){ pxS.edit[i] = !pxS.edit[i]; pxRenderReview(); }
function pxSaveEdit(i){
  const it = pxS.items[i]; if (!it) return;
  const q = (document.getElementById("pxQ" + i) || {}).value || "";
  const opts = ((document.getElementById("pxO" + i) || {}).value || "").split("\n").map((s) => s.trim()).filter(Boolean).slice(0, 6);
  if (q.trim().length < 5 || opts.length < 2) { pxLog("Keep a question and at least 2 options."); return; }
  const changed = q.trim() !== it.q || opts.join("|") !== it.options.join("|");
  it.q = q.trim(); it.options = opts; it.incomplete = false;
  if (changed) {
    if (it.answer >= opts.length) { it.answer = -1; it.answerSource = ""; }
    it.explanation = ""; it.audit = null; it.disagree = ""; it.posWords = false;
    if (it.status === "approved") it.status = "review";
  }
  pxS.edit[i] = false; pxDecide(it); pxSave(); pxRenderReview();
  if (changed && it.answer >= 0 && opts.length === 4) pxExplainOne(i);
}
function pxApprove(i){
  const it = pxS.items[i]; if (!it) return;
  if (pxBlockers(it).length) return;
  it.status = "approved"; pxSave(); pxRenderReview(); pxRenderProg();
}
function pxReject(i){ const it = pxS.items[i]; if (it) { it.status = it.status === "rejected" ? "review" : "rejected"; if (it.status === "review") pxDecide(it); pxSave(); pxRenderReview(); pxRenderProg(); } }
function pxApproveClean(){
  let n = 0;
  pxS.items.forEach((it) => { if (it.status === "clean" && !pxBlockers(it).length) { it.status = "approved"; n++; } });
  pxLog(n + " clean questions approved."); pxSave(); pxRenderReview(); pxRenderProg();
}
function pxFilter(f){ pxS.filter = f; pxS.page = 0; pxRenderReview(); }
function pxPage(p){ pxS.page = Math.max(0, p); pxRenderReview(); const el = document.getElementById("pxReview"); if (el) el.scrollIntoView({ block: "start" }); }
function pxCounts(){
  const c = { all: pxS.items.length, review: 0, clean: 0, approved: 0, rejected: 0, new: 0 };
  pxS.items.forEach((it) => { c[it.status] = (c[it.status] || 0) + 1; });
  return c;
}
function pxPublishable(){
  return pxS.items.filter((it) => it.status === "approved" && !pxBlockers(it).length).map((it) => ({
    n: it.n, q: it.q, options: it.options, answer: it.answer, explanation: it.explanation.trim(),
    topic: it.topic && it.topic !== "Other" ? it.topic : "General", level: it.level || "",
    flags: ["paper-extractor", "answer:" + (it.answerSource || "ai")].concat(it.improved ? ["reworded"] : []).concat(it.risk.length ? ["reviewed"] : [])
  }));
}
function pxDownload(){
  const blob = new Blob([JSON.stringify({ paper: pxS.paper, questions: pxS.items }, null, 2)], { type: "application/json" });
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob);
  a.download = "paper-review-" + (pxS.paper.title || "draft").toLowerCase().replace(/[^a-z0-9]+/g, "-").slice(0, 40) + ".json";
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
async function pxPublish(){
  pxReadForm();
  const qs = pxPublishable();
  const msg = document.getElementById("pxPubMsg");
  const say = (t, bad) => { if (msg) { msg.textContent = t; msg.style.color = bad ? "#b42318" : "#173f35"; } };
  if (!pxS.paper.title) return say("Give the paper a title first, for example “KRCHN Nov 2023 Paper 1”.", true);
  if (!qs.length) return say("Approve some questions first.", true);
  if (!confirm("Publish " + qs.length + " approved questions as the past paper “" + pxS.paper.title + "”? Publishing again later creates a second copy.")) return;
  say("Publishing…");
  try {
    const api = String(NCK_BANK_API_URL || "").replace(/\/$/, "");
    const res = await fetch(api + "/publish-paper", {
      method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + abGetKey() },
      body: JSON.stringify({ title: pxS.paper.title, year: pxS.paper.year, cadre: pxS.paper.cadre, minutes: pxS.paper.minutes, access: pxS.paper.access, questions: qs })
    });
    const d = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error((d && d.error) || ("HTTP " + res.status));
    pxS.published = { title: pxS.paper.title, count: d.questionCount, at: new Date().toLocaleString() };
    pxSave();
    say("Published " + d.questionCount + " questions." + ((d.rejected || []).length ? " " + d.rejected.length + " were refused by the server." : "") + " " + (d.message || ""));
  } catch (e) { say("Could not publish: " + (e && e.message ? e.message : "error"), true); }
}

      ${it.proposalErr && !it.proposal ? `<div class="px-hint">${abEsc(it.proposalErr)}</div>` : ""}
      ${it.risk.length ? `<ul class="px-risk">${it.risk.map((r) => `<li>${abEsc(r)}</li>`).join("")}</ul>` : ""}
      ${it.needsFigure ? `<label class="px-hint"><input type="checkbox" ${it.figureOk ? "checked" : ""} onchange="pxFigureOk(${i},this.checked)"> The text is enough without the figure</label>` : ""}
      <label class="px-hint" style="margin-top:8px">Explanation ${busy ? "(writing…)" : ""}</label>
      <textarea ${busy ? "disabled" : ""} oninput="pxSetExpl(${i},this.value)" onchange="pxExplDone(${i})" placeholder="Written after the answer is chosen">${abEsc(it.explanation)}</textarea>
      <div class="px-acts">
        <select onchange="pxSetTopic(${i},this.value)"><option value="">Topic…</option>${topics.map((t) => `<option ${t === it.topic ? "selected" : ""}>${abEsc(t)}</option>`).join("")}</select>
        <select onchange="pxSetLevel(${i},this.value)"><option value="">Level…</option>${["recall", "application", "analysis"].map((l) => `<option ${l === it.level ? "selected" : ""}>${l}</option>`).join("")}</select>
        <button class="nck-btn" ${blockers.length || st === "approved" ? "disabled" : ""} onclick="pxApprove(${i})" title="${abEsc(blockers.join("; "))}">${st === "approved" ? "Approved" : "Approve"}</button>
        <button class="nck-btn-ghost" ${busy ? "disabled" : ""} onclick="pxExplainOne(${i})">Re-explain</button>
        <button class="nck-btn-ghost" ${busy || it.answer < 0 || it.options.length !== 4 ? "disabled" : ""} onclick="pxImproveOne(${i})">Improve wording</button>
        ${it.improved ? `<button class="nck-btn-ghost" onclick="pxRevertWording(${i})">Back to original wording</button>` : ""}
        <button class="nck-btn-ghost" onclick="pxToggleEdit(${i})">Edit text</button>
        <button class="nck-btn-ghost" onclick="pxReject(${i})">${st === "rejected" ? "Restore" : "Reject"}</button>
        ${blockers.length && st !== "approved" ? `<span class="px-hint">To approve: ${abEsc(blockers.join("; "))}</span>` : ""}
      </div>`}
  </div>`;
}
function pxReviewHTML(){
  if (!pxS.items.length) return "";
  const c = pxCounts(), f = pxS.filter, PAGE = 15;
  const match = (it) => f === "all" ? true : f === "review" ? (it.status === "review" || it.status === "new") : it.status === f;
  const list = []; pxS.items.forEach((it, i) => { if (match(it)) list.push(i); });
  const pages = Math.max(1, Math.ceil(list.length / PAGE)); if (pxS.page >= pages) pxS.page = pages - 1;
  const chips = [["review", "Needs review", c.review + c.new], ["clean", "Clean", c.clean], ["approved", "Approved", c.approved], ["rejected", "Rejected", c.rejected], ["all", "All", c.all]];
  const nPub = pxPublishable().length;
  return `
    <div class="px-box">
      <h3>Review</h3>
      <p class="px-hint">“Clean” means both AI passes agreed, confidence was high, the explanation passed the audit and nothing was flagged. Flagged questions are the ones to read carefully. Only <b>approved</b> questions are published.</p>
      <div class="px-chips">${chips.map(([id, l, n]) => `<button class="px-chip ${f === id ? "on" : ""}" onclick="pxFilter('${id}')">${l} (${n})</button>`).join("")}</div>
      <div class="px-row">
        <button class="nck-btn-ghost" onclick="pxApproveClean()" ${c.clean ? "" : "disabled"}>Approve all clean (${c.clean})</button>
        <button class="nck-btn-ghost" onclick="pxAcceptAll()" ${pxS.items.some((it) => it.proposal) && !pxS.running ? "" : "disabled"}>Accept all suggested wording (${pxS.items.filter((it) => it.proposal).length})</button>
        <button class="nck-btn" onclick="pxPublish()" ${nPub ? "" : "disabled"}>Publish approved (${nPub})</button>
        <button class="nck-btn-ghost" onclick="pxDownload()">Download JSON</button>
      </div>
      <p class="ab-status" id="pxPubMsg" style="margin:8px 0 0">${pxS.published ? "Last published: " + abEsc(pxS.published.title) + " (" + pxS.published.count + " questions) at " + abEsc(pxS.published.at) : ""}</p>
    </div>
    ${list.slice(pxS.page * PAGE, pxS.page * PAGE + PAGE).map((i) => pxCardHTML(pxS.items[i], i)).join("") || `<p class="px-hint">Nothing in this list.</p>`}
    ${pages > 1 ? `<div class="px-row"><button class="nck-btn-ghost" ${pxS.page ? "" : "disabled"} onclick="pxPage(${pxS.page - 1})">Previous</button><span class="px-hint">Page ${pxS.page + 1} of ${pages}</span><button class="nck-btn-ghost" ${pxS.page < pages - 1 ? "" : "disabled"} onclick="pxPage(${pxS.page + 1})">Next</button></div>` : ""}`;
}
function pxRenderProg(){ const el = document.getElementById("pxProg"); if (el) el.innerHTML = pxProgHTML(); }
function pxRenderReview(){
  const el = document.getElementById("pxReview"); if (!el) return;
  // do not redraw while the admin is typing in a box on a card
  const a = document.activeElement;
  if (a && el.contains(a) && (a.tagName === "TEXTAREA" || a.tagName === "INPUT") && pxS.running) return;
  el.innerHTML = pxReviewHTML();
}
function pxRenderAll(){ pxRenderProg(); pxRenderReview(); const b = document.getElementById("pxBtns"); if (b) b.innerHTML = pxBtnsHTML(); }
function pxBtnsHTML(){
  const has = pxS.items.length > 0;
  return pxS.running
    ? `<button class="nck-btn" onclick="pxStop()">Stop</button><span class="px-hint">Working… you can leave this tab open. Progress is saved as it goes.</span>`
    : `<button class="nck-btn" onclick="pxRun()">${has ? "Continue / run again" : "Start"}</button><button class="nck-btn-ghost" onclick="pxClear()">Clear paper</button>`;
}
function pxHTML(){
  pxCss();
  const p = pxS.paper;
  return `
    <div class="px-box">
      <h3>Paper extractor</h3>
      <p class="px-hint">Upload a past paper. The AI reads the questions, chooses the correct answer twice independently (the second time with the options in reverse order), writes an explanation and audits it. Anything doubtful is flagged for you. Approved questions are published as a <b>Past paper</b>. This does not touch the question generator.</p>
      ${pxS.restored ? `<p class="px-hint" style="color:#7a5316"><b>Your earlier work on this paper was restored.</b> Press Continue to carry on, or Clear paper to start a new one.</p>` : ""}
    </div>
    <div class="px-box">
      <h3>1. The paper</h3>
      <div class="px-grid">
        <div><label for="pxTitle">Title (shown to students)</label><input id="pxTitle" value="${abEsc(p.title)}" placeholder="KRCHN Nov 2023 Paper 1"></div>
        <div><label for="pxYear">Year</label><input id="pxYear" value="${abEsc(p.year)}" placeholder="2023"></div>
        <div><label for="pxCadre">Cadre</label><select id="pxCadre"><option ${p.cadre === "KRCHN" ? "selected" : ""}>KRCHN</option><option ${p.cadre === "BScN" ? "selected" : ""}>BScN</option></select></div>
        <div><label for="pxMin">Minutes (optional)</label><input id="pxMin" value="${abEsc(p.minutes)}" placeholder="auto"></div>
        <div><label for="pxAccess">Access</label><select id="pxAccess"><option value="paid" ${p.access === "paid" ? "selected" : ""}>Paid</option><option value="free" ${p.access === "free" ? "selected" : ""}>Free</option></select></div>
        <div><label for="pxImprove">Better wording</label><select id="pxImprove"><option value="off" ${pxS.improve === "off" ? "selected" : ""}>Off (keep the paper's wording)</option><option value="suggest" ${pxS.improve === "suggest" ? "selected" : ""}>Suggest (I approve each)</option><option value="apply" ${pxS.improve === "apply" ? "selected" : ""}>Apply automatically</option></select></div>
        <div><label for="pxTier">AI quality</label><select id="pxTier"><option value="standard" ${pxS.tier === "standard" ? "selected" : ""}>Best (more accurate, costs more)</option><option value="economy" ${pxS.tier === "economy" ? "selected" : ""}>Economy (cheaper)</option></select></div>
      </div>
      <label for="pxFile" style="margin-top:8px">Upload PDF, Word or text file(s). You can add the answer key as a second file.</label>
      <input type="file" id="pxFile" multiple accept=".pdf,.docx,.txt,.md" onchange="pxOnFiles(this)">
      <p class="px-hint" id="pxFileStatus">${pxS.fileNotes.slice(-4).map(abEsc).join("<br>")}</p>
      <label for="pxText">…or paste the paper text here</label>
      <textarea id="pxText" onchange="pxReadForm();pxSave()" placeholder="Paste the questions (and the answer key if you have one)">${abEsc(pxS.text)}</textarea>
      <p class="px-hint">Only papers you have permission to use should be uploaded. Scanned (image-only) PDFs cannot be read; use a text version.</p>
      <div class="px-row" id="pxBtns">${pxBtnsHTML()}</div>
    </div>
    <div class="px-box"><h3>2. Progress</h3><div id="pxProg">${pxProgHTML()}</div></div>
    <div id="pxReview">${pxReviewHTML()}</div>`;
}

</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex, nofollow" />
  <title>NurseVault Admin</title>
  <style>
    :root { --bg:#f5f1e7; --card:#fff; --ink:#21382f; --line:#d9d4c7; --green:#173f35; --muted:#64746b; --err:#b42318; }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--ink); }
    .wrap { max-width: 920px; margin: 0 auto; padding: 28px 18px 60px; }
    h1 { font-size: 1.4rem; margin: 0 0 6px; }
    .sub { color: var(--muted); margin: 0 0 22px; font-size: .92rem; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 18px 18px; margin: 0 0 16px; }
    label { display: block; font-weight: 600; font-size: .85rem; margin: 0 0 6px; }
    input[type=password], input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; }
    .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-top: 12px; }
    .row > div { flex: 1; min-width: 180px; }
    button { border: 0; border-radius: 999px; padding: 10px 16px; font-weight: 600; cursor: pointer; background: var(--green); color: #fff; }
    button.secondary { background: transparent; color: var(--green); border: 1px solid var(--green); }
    button:disabled { opacity: .55; cursor: not-allowed; }
    .err { color: var(--err); margin-top: 10px; font-size: .9rem; }
    .ok { color: var(--green); margin-top: 10px; font-size: .9rem; }
    pre { background: #0f1f1a; color: #d7efe6; padding: 14px; border-radius: 12px; overflow: auto; font-size: 12px; line-height: 1.45; max-height: 480px; }
    .hint { font-size: .85rem; color: var(--muted); margin-top: 10px; }
    table { width: 100%; border-collapse: collapse; font-size: .9rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font-size: .75rem; text-transform: uppercase; letter-spacing: .03em; color: var(--muted); }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>NurseVault Admin</h1>
    <p class="sub">Private control surface. Protect this file with Cloudflare Access. Not linked from the public site.</p>

    <div class="card" id="unlockCard">
      <label for="adminKey">ADMIN_KEY</label>
      <input id="adminKey" type="password" autocomplete="off" placeholder="Worker secret ADMIN_KEY" />
      <div class="row">
        <div>
          <label for="authUrl">Accounts Worker URL</label>
          <input id="authUrl" type="text" value="https://accounts.nursevault.co.ke" />
        </div>
        <button type="button" id="btnUnlock">Unlock</button>
        <button type="button" class="secondary" id="btnClear">Clear key</button>
      </div>
      <div class="err" id="err" hidden></div>
      <div class="ok" id="ok" hidden></div>
      <p class="hint">Key is kept in sessionStorage for this tab only. Prefer Cloudflare Access on <code>/admin.html</code> or <code>admin.nursevault.co.ke</code>.</p>
    </div>

    <div class="card" id="actionsCard" hidden>
      <div class="row">
        <button type="button" id="btnSnapshot">Load snapshot</button>
        <button type="button" class="secondary" id="btnHealth">Health</button>
      </div>
      <div id="summary" style="margin-top:14px"></div>
      <pre id="out" hidden></pre>
    </div>
  </div>
  <script>
    const KEY = "nv_admin_key";
    const $ = (id) => document.getElementById(id);
    function getKey(){ try { return sessionStorage.getItem(KEY) || ""; } catch(e){ return ""; } }
    function setKey(k){ try { sessionStorage.setItem(KEY, k || ""); } catch(e){} }
    function clearKey(){ try { sessionStorage.removeItem(KEY); } catch(e){} }
    function apiBase(){ return ($("authUrl").value || "").replace(/\/$/, ""); }

    function showErr(msg){ const e=$("err"); e.hidden=!msg; e.textContent=msg||""; $("ok").hidden=true; }
    function showOk(msg){ const o=$("ok"); o.hidden=!msg; o.textContent=msg||""; $("err").hidden=true; }

    function setUnlocked(on){
      $("actionsCard").hidden = !on;
      if (!on) { $("out").hidden = true; $("summary").innerHTML = ""; }
    }

    async function unlock(){
      const key = $("adminKey").value.trim();
      if (!key || key.length < 16) { showErr("Use the full ADMIN_KEY (16+ characters)."); return; }
      $("btnUnlock").disabled = true;
      try {
        const r = await fetch(apiBase() + "/admin/snapshot", {
          headers: { "Authorization": "Bearer " + key }
        });
        const data = await r.json().catch(() => ({}));
        if (!r.ok) {
          showErr(data.error || ("HTTP " + r.status));
          setUnlocked(false);
          return;
        }
        setKey(key);
        showOk("Unlocked.");
        setUnlocked(true);
        renderSnapshot(data);
      } catch (e) {
        showErr("Could not reach accounts worker. Check URL and CORS.");
        setUnlocked(false);
      } finally {
        $("btnUnlock").disabled = false;
      }
    }

    function renderSnapshot(data){
      const users = data.users || data.userCount || data.totalUsers;
      const active = data.subscriptionActiveCount || data.activeSubscriptions;
      const events = data.recentEvents || data.events || [];
      let html = "<table><thead><tr><th>Field</th><th>Value</th></tr></thead><tbody>";
      const rows = [
        ["Users", users != null ? users : "—"],
        ["Active subscriptions", active != null ? active : "—"],
        ["Generated", data.at || data.generatedAt || new Date().toISOString()]
      ];
      Object.keys(data || {}).slice(0, 12).forEach(k => {
        if (typeof data[k] === "number" || typeof data[k] === "string" || typeof data[k] === "boolean") {
          if (!["at","generatedAt"].includes(k)) rows.push([k, String(data[k])]);
        }
      });
      const seen = new Set();
      rows.forEach(([k,v]) => {
        if (seen.has(k)) return; seen.add(k);
        html += "<tr><td>" + esc(k) + "</td><td>" + esc(v) + "</td></tr>";
      });
      html += "</tbody></table>";
      if (Array.isArray(events) && events.length) {
        html += "<p class='hint' style='margin-top:12px'>Recent events (truncated)</p><table><thead><tr><th>Type</th><th>Meta</th></tr></thead><tbody>";
        events.slice(0, 15).forEach(ev => {
          html += "<tr><td>" + esc(ev.type || ev.t || "") + "</td><td>" + esc(JSON.stringify(ev).slice(0, 120)) + "</td></tr>";
        });
        html += "</tbody></table>";
      }
      $("summary").innerHTML = html;
      $("out").hidden = false;
      $("out").textContent = JSON.stringify(data, null, 2);
    }

    function esc(s){
      return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));
    }

    $("btnUnlock").onclick = unlock;
    $("btnClear").onclick = () => { clearKey(); $("adminKey").value=""; setUnlocked(false); showOk("Cleared."); };
    $("btnSnapshot").onclick = unlock;
    $("btnHealth").onclick = async () => {
      try {
        const r = await fetch(apiBase() + "/health");
        const d = await r.json();
        showOk("Health: " + JSON.stringify(d));
      } catch (e) { showErr("Health check failed."); }
    };

    // Restore key for this tab
    const existing = getKey();
    if (existing) { $("adminKey").value = existing; setUnlocked(true); }
  </script>
</body>
</html>

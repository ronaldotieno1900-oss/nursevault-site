}
function pxL(i){ return String.fromCharCode(65 + i); }
function pxNorm(s){ return String(s == null ? "" : s).toLowerCase().replace(/[^a-z0-9]+/g, " ").trim(); }
function pxSig(t){ t = String(t || ""); return t.length + ":" + t.slice(0, 60); }
function pxLog(msg){ pxS.log.push(new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", second: "2-digit" }) + "  " + msg); if (pxS.log.length > 40) pxS.log.shift(); pxRenderProg(); }
function pxStage(label, done, total){ pxS.stage = label; pxS.stageDone = done; pxS.stageTotal = total; pxRenderProg(); }
const pxSleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ---------- reading files (keeps line breaks, which the PDF reader in the generator does not) ---------- */
async function pxExtractPdf(buf){
  await abLoadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
  const lib = window["pdfjs-dist/build/pdf"] || window.pdfjsLib;
  if (!lib) throw new Error("PDF library not available");
  lib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const doc = await lib.getDocument({ data: buf }).promise;
  const pages = Math.min(doc.numPages, 80), out = [];
  for (let p = 1; p <= pages; p++) {
    const page = await doc.getPage(p);
    const content = await page.getTextContent();
    const items = (content.items || []).filter((it) => it && typeof it.str === "string" && it.transform);
    items.sort((a, b) => (b.transform[5] - a.transform[5]) || (a.transform[4] - b.transform[4]));
    const lines = []; let cur = null;
    items.forEach((it) => {
      const y = it.transform[5], tol = Math.max(3, (it.height || 8) * 0.5);
      if (!cur || Math.abs(cur.y - y) > tol) { cur = { y, parts: [] }; lines.push(cur); }
      cur.parts.push(it);
    });
    const text = lines.map((ln) => {
      ln.parts.sort((a, b) => a.transform[4] - b.transform[4]);
      let s = "", prevEnd = null;
      ln.parts.forEach((it) => {
        const x = it.transform[4];
        if (prevEnd != null && x - prevEnd > 1.2 && s && !/\s$/.test(s) && !/^\s/.test(it.str)) s += " ";
        s += it.str; prevEnd = x + (it.width || 0);
      });
      return s.replace(/\s+$/, "");
    }).filter((s) => s.trim()).join("\n");
    out.push(text);
  }
  return { text: out.join("\n\n"), pages };
}
async function pxOnFiles(input){
  const files = Array.from((input && input.files) || []);
  const st = document.getElementById("pxFileStatus");
  if (!files.length) return;
  let added = "";
  for (const f of files) {
    try {
      if (st) st.textContent = "Reading " + f.name + "…";
      const name = f.name.toLowerCase();
      let text = "", note = "";
      if (name.endsWith(".pdf")) {
        const r = await pxExtractPdf(await f.arrayBuffer());
        text = r.text;
        note = f.name + ": " + r.pages + " pages, " + text.length + " characters";
        if (text.replace(/\s/g, "").length < r.pages * 150) note += " — very little text found. This looks like a scanned paper (images). Scanned papers need OCR first; paste the text instead.";
      } else if (name.endsWith(".docx")) {
        text = await abExtractDocx(await f.arrayBuffer());
        note = f.name + ": " + text.length + " characters";
      } else {
        text = await f.text();
        note = f.name + ": " + text.length + " characters";
      }
      added += "\n\n----- " + f.name + " -----\n\n" + text;
      pxS.fileNotes.push(note);
    } catch (e) {
      pxS.fileNotes.push(f.name + ": could not be read (" + (e && e.message ? e.message : "error") + ")");
    }

/* ---------- splitting into parts that start at question boundaries ---------- */
function pxChunks(text){
  const lines = String(text || "").replace(/\r/g, "").split("\n");
  const startRe = /^\s*(?:Q(?:uestion)?\.?\s*)?\d{1,3}\s*[.)]\s*\S/i;
  const TARGET = 5500, HARD = 9000, chunks = [];
  let cur = [], len = 0;
  const flush = () => { const t = cur.join("\n"); if (t.trim()) chunks.push(t); cur = []; len = 0; };
  for (const ln of lines) {
    if (len >= TARGET && startRe.test(ln)) flush();
    else if (len >= HARD) flush();
    cur.push(ln); len += ln.length + 1;
  }
  flush();
  return chunks;
}

/* ---------- calling the AI worker ---------- */
async function pxCall(body){
  const key = abGetKey();
  const url = String(NCK_EXPLAIN_URL || "").replace(/\/$/, "");
  let lastErr = "";
  for (let attempt = 1; attempt <= 3; attempt++) {
    if (attempt > 1) await pxSleep(1500 * attempt);
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 120000);
    try {
      const res = await fetch(url, {
        method: "POST", signal: ctl.signal,
        headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
        body: JSON.stringify(Object.assign({ tier: pxS.tier }, body))
      });
      const data = await res.json().catch(() => ({}));
      clearTimeout(timer);
      if (res.status === 401) { const e = new Error("Admin key was not accepted. Lock and unlock again."); e.fatal = true; throw e; }
      if (res.ok && data && data.ok !== false) {
        if (data.usage) { pxS.usage.inT += data.usage.in || 0; pxS.usage.outT += data.usage.out || 0; pxS.usage.calls += data.usage.calls || 0; }
        return data;
      }
      lastErr = (data && data.error) || ("HTTP " + res.status);
      if (res.status === 400) break;
    } catch (e) {
      clearTimeout(timer);
      if (e && e.fatal) throw e;
      lastErr = e && e.name === "AbortError" ? "timed out" : (e && e.message) || "network error";
    }
  }
  throw new Error(lastErr || "failed");
}

/* ---------- step 1: read the questions ---------- */
function pxAddQuestion(q){
  const sig = pxNorm(q.q) + "|" + pxNorm((q.options || []).join("|"));
  const at = pxS.items.findIndex((x) => x.sig === sig);
  const it = {
    sig, n: q.n, q: q.q, options: q.options, keyGiven: q.keyGiven, needsFigure: !!q.needsFigure, incomplete: !!q.incomplete,
    figureOk: false, a1: null, a2: null, answer: -1, answerSource: "", topic: "", level: "",
    explanation: "", audit: null, disagree: "", posWords: false, status: "new", risk: []
  };
  if (at >= 0) { if (pxS.items[at].incomplete && !it.incomplete) pxS.items[at] = it; return; }
  pxS.items.push(it);
}
function pxApplyKey(){
  const keys = Object.keys(pxS.key || {});

  const seen = new Set(); let dup = false;
  pxS.items.forEach((it) => { if (it.n != null) { if (seen.has(it.n)) dup = true; seen.add(it.n); } });
  if (dup) { pxLog("Question numbers repeat (more than one paper in the file?), so the answer key was NOT applied automatically."); return; }
  let used = 0;
  pxS.items.forEach((it) => {
    const L = pxS.key[String(it.n)];
    if (!it.keyGiven && L && L.charCodeAt(0) - 65 < it.options.length) { it.keyGiven = L; used++; }
  });
  pxLog("Answer key found for " + used + " questions. The AI will still check it.");
}
async function pxStageExtract(){
  const sig = pxSig(pxS.text);
  if (sig !== pxS.textSig) { pxS.items = []; pxS.key = {}; pxS.chunkDone = 0; pxS.extractDone = false; pxS.textSig = sig; }
  const chunks = pxChunks(pxS.text);
  pxS.chunkTotal = chunks.length;
  pxStage("Reading the questions", pxS.chunkDone, chunks.length);
  for (let c = pxS.chunkDone; c < chunks.length; c++) {

/** Detect form cues that can give the answer away (length / detail). */

  if (ansL > mean * 1.2 && ansL - mean >= 8) return "key-much-longer";

/* ---------- deciding the answer and the risk flags ---------- */
function pxDecide(it){

  if (p1 && p1.pick != null) { if (keyOk) ai = p1.pick; else if (p2 && p2.pick != null && p2.pick === p1.pick) ai = p1.pick; }
  const manual = it.answerSource === "manual";
  if (!manual) {
    if (keyOk) {
      it.answer = k; it.answerSource = "key";
      if (ai != null && ai !== k) risk.push("The paper's own key says " + pxL(k) + " but the AI chose " + pxL(ai) + ". Check which is right.");
    } else if (ai != null) { it.answer = ai; it.answerSource = "ai"; }
    else {
      it.answer = -1; it.answerSource = "";

    }
    const confs = [p1, p2].filter(Boolean).map((p) => p.confidence);
    if (confs.length && Math.min.apply(null, confs) < 75) risk.push("Low AI confidence (" + Math.min.apply(null, confs) + "%).");
    const flags = Array.from(new Set([].concat(p1 ? p1.flags : [], p2 ? p2.flags : [])));

  }
  if (it.needsFigure && !it.figureOk) risk.push("Needs a figure or table that is not in the text.");
  if (it.incomplete) risk.push("Looks cut off. Check the text against the paper.");
  if (it.options.length !== 4) risk.push("Has " + it.options.length + " options; the site needs exactly 4.");
  if (new Set(it.options.map(pxNorm)).size < it.options.length) risk.push("Two options are identical.");
  if (it.disagree) risk.push("The explainer thinks the chosen answer is wrong: " + it.disagree);
  if (it.audit && !it.audit.ok) risk.push("Audit: " + ((it.audit.issues || []).join(" ") || "not approved."));
  if (it.explanation && it.posWords) risk.push("The explanation mentions an option by letter or position. Edit it.");

const PX_BLOOM_TO_LEVEL = { remember: "recall", understand: "recall", apply: "application", analyze: "analysis", evaluate: "analysis" };

  const hasClient = /\b(woman|mother|patient|client|neonate|infant|child|man|boy|girl|primigravida|multigravida|nurse caring)\b/.test(q);
  const actionPlan = /\b(most appropriate|next step|first action|first priority|plan for|should the nurse|nursing intervention|management of|what should|what is the (best|priority) (action|intervention|plan))\b/.test(q);
  const pureFact = /\b(normal (range|value|rate)|is called|is known as|definition of|what is the normal|baseline .+ is considered normal|recommended (dose|range))\b/.test(q)

    pxLog("Classified: " + r.rules + " by rules (no tokens), " + r.ai + " by AI" + (r.failed ? ", " + r.failed + " failed" : "") + ".");

}
function pxBlockers(it){
  const b = [];

  if (it.options.length !== 4) b.push("needs exactly 4 options");
  else if (new Set(it.options.map(pxNorm)).size < 4) b.push("options must be different");
  if (it.needsFigure && !it.figureOk) b.push("needs a figure (tick the box if the text is enough)");

}

/* ---------- running ---------- */
function pxPendingCount(){

}
function pxResetAiOnItem(it){

/** mode: "start" | "continue" | "again" */
async function pxRun(mode){
  if (pxS.running) return;
  mode = mode === "again" ? "again" : mode === "continue" ? "continue" : "start";
  pxReadForm();
  if (!abGetKey()) { pxLog("Unlock the admin first."); return; }
  if (!pxS.items.length && pxS.text.replace(/\s/g, "").length < 40) { pxLog("Upload a paper or paste its text first."); return; }
  if (pxS.extractDone && !pxS.items.length && pxSig(pxS.text) === pxS.textSig) {
    pxLog("Every question from this paper has already been published or removed. Press Clear paper to start a new one.");
    pxRenderProg();
    return;
  }
  const textChanged = pxS.items.length && pxSig(pxS.text) !== pxS.textSig && pxS.text.replace(/\s/g, "").length >= 40;
  if (mode === "again") {
    if (textChanged) {
      if (!confirm("The paper text changed. Run again will re-read the paper and replace the " + pxS.items.length + " questions below. Continue?")) return;
    } else if (pxS.items.length) {
      if (!confirm("Run again will redo answers and explanations for questions that are not approved. Approved questions stay as they are. Continue?")) return;
      pxS.items.forEach(pxResetAiOnItem);
      pxSave();
    }
  } else if (mode === "continue") {
    if (!pxS.extractDone && !pxS.items.length) {
      pxLog("Nothing to continue yet. Press Start first.");
      return;
    }
    if (textChanged) {
      pxLog("The paper text changed. Press Run again to re-read it, or restore the previous text to Continue.");
      return;
    }
    if (pxS.extractDone && !pxPendingCount()) {
      pxLog("Nothing left to continue — all questions already have answers and explanations. Use Run again to redo non-approved ones.");
      return;
    }
  } else {
    // start
    if (textChanged && !confirm("The paper text changed. Starting will replace the " + pxS.items.length + " questions below. Continue?")) return;
  }
  pxS.running = true; pxS.stop = false; pxS.restored = false; pxRenderAll();
  try {
    const mustExtract = mode === "again"
      ? (textChanged || !pxS.extractDone)
      : (!pxS.extractDone || (mode === "start" && textChanged));
    if ((pxS.text.replace(/\s/g, "").length >= 40 || !pxS.extractDone) && mustExtract) {
      if (!pxS.extractDone || pxSig(pxS.text) !== pxS.textSig) await pxStageExtract();
    }
    if (!pxS.stop && pxS.extractDone) await pxStageAnswer();
    if (!pxS.stop && pxS.extractDone && pxS.improve !== "off") await pxStageImprove();
    if (!pxS.stop && pxS.extractDone) await pxStageExplain();
    if (!pxS.stop && pxS.extractDone) {
      const cls = await pxStageClassify(false);
      if (cls.rules || cls.ai) pxLog("Tags: " + cls.rules + " by rules (free), " + cls.ai + " by AI" + (cls.failed ? ", " + cls.failed + " failed" : "") + ".");
    }
    pxS.items.forEach(pxDecide);
    if (pxS.stop) pxLog("Stopped. Everything so far is saved. Press Continue to carry on.");
    else if (pxS.extractDone) {
      const left = pxPendingCount();
      pxLog(left ? left + " questions still need an answer or explanation. Press Continue to retry them." : "Done. Review the flagged questions, then publish.");
    }
  } catch (e) { pxLog("Stopped: " + (e && e.message ? e.message : "error")); }
  pxS.running = false; pxS.stage = ""; pxSave(); pxRenderAll();
}
function pxStop(){ if (pxS.running) { pxS.stop = true; pxLog("Stopping after the current step…"); } }
function pxClear(){
  if (pxS.running) return;

/* ---------- review actions ---------- */
function pxSetAns(i, k){

}

}

}

function pxToggleEdit(i){ pxS.edit[i] = !pxS.edit[i]; pxRenderReview(); }
function pxSaveEdit(i){

  if (q.trim().length < 5 || opts.length < 2) { pxLog("Keep a question and at least 2 options."); return; }
  const changed = q.trim() !== it.q || opts.join("|") !== it.options.join("|");

}
function pxApprove(i){

function pxFilter(f){ pxS.filter = f; pxS.page = 0; pxRenderReview(); }
function pxPage(p){ pxS.page = Math.max(0, p); pxRenderReview(); const el = document.getElementById("pxReview"); if (el) el.scrollIntoView({ block: "start" }); }
function pxCounts(){
  const c = { all: pxS.items.length, review: 0, clean: 0, approved: 0, rejected: 0, new: 0 };
  pxS.items.forEach((it) => { c[it.status] = (c[it.status] || 0) + 1; });

/* ---------- Nothing is ever published twice ----------
   The bank worker is the source of truth (it looks at every published question). This browser also keeps a small
   history of what it published, used only when the worker cannot be reached. */
const PX_LEDGER = "nv_px_published_v1";
function pxPubSig(it){ return pxNorm(it.q) + "|" + (it.options || []).map(pxNorm).filter(Boolean).sort().join("|"); }
function pxLedgerGet(){ try { const o = JSON.parse(localStorage.getItem(PX_LEDGER) || "{}"); return o && typeof o === "object" ? o : {}; } catch (e) { return {}; } }
function pxLedgerAdd(items, label){
  try {
    const o = pxLedgerGet(), at = new Date().toISOString().slice(0, 10);
    items.forEach((it) => { o[pxPubSig(it)] = { t: String(label || "").slice(0, 80), at }; });
    localStorage.setItem(PX_LEDGER, JSON.stringify(o));
  } catch (e) {}
}
/** Which of these items are already published? Returns { dups: Map(item -> where), viaServer }. */
async function pxCheckPublished(items){
  const dups = new Map();
  const api = String(NCK_BANK_API_URL || "").replace(/\/$/, ""), key = abGetKey();
  if (api && key && items.length) {
    try {
      const res = await fetch(api + "/admin/duplicates", {
        method: "POST", headers: { "Content-Type": "application/json", "Authorization": "Bearer " + key },
        body: JSON.stringify({ questions: items.map((it) => ({ q: it.q, options: it.options })) })
      });
      const d = await res.json().catch(() => ({}));
      if (res.ok && d && d.ok && Array.isArray(d.duplicates)) {
        d.duplicates.forEach((x) => { if (items[x.i]) dups.set(items[x.i], x.where || "the question bank"); });
        return { dups, viaServer: true };
      }
    } catch (e) {}
  }
  const led = pxLedgerGet();
  items.forEach((it) => { const hit = led[pxPubSig(it)]; if (hit) dups.set(it, hit.t || "an earlier publish from this browser"); });
  return { dups, viaServer: false };
}
function pxRemoveItems(set){
  if (!set || !set.size) return 0;
  const before = pxS.items.length;
  pxS.items = pxS.items.filter((it) => !set.has(it));
  pxS.edit = {}; pxS.busy = {}; pxS.page = 0;
  return before - pxS.items.length;
}
/** Removes questions that are already published from the extractor. Returns how many were removed. */
async function pxDropPublished(items, quiet){
  const list = items || pxS.items.slice();
  if (!list.length) return 0;
  const r = await pxCheckPublished(list);
  const n = pxRemoveItems(new Set(r.dups.keys()));
  if (n) { pxS.hiddenPublished = (pxS.hiddenPublished || 0) + n; pxLog(n + " question" + (n === 1 ? " is" : "s are") + " already published, so " + (n === 1 ? "it was" : "they were") + " removed."); }
  else if (!quiet) pxLog("None of the " + list.length + " questions are already published.");
  if (!r.viaServer && list.length) pxLog("Could not reach the question bank to check, so only this browser's publish history was used. Deploy the updated NCK worker.");
  pxSave(); pxRenderProg(); pxRenderReview();
  return n;
}
async function pxRemovePublished(){
  if (pxS.running) return;
  const msg = document.getElementById("pxPubMsg");
  if (msg) { msg.style.color = "#173f35"; msg.textContent = "Checking the question bank…"; }
  const n = await pxDropPublished(null, false);
  const m2 = document.getElementById("pxPubMsg");
  if (m2) { m2.style.color = "#173f35"; m2.textContent = n ? n + " already-published question" + (n === 1 ? " was" : "s were") + " removed." : "None of these questions are already published."; }
}
/** After a publish request: remove what was published (and anything found to be a duplicate) from the extractor. */
function pxApplyPublishResult(items, d, offset, label, count){
  offset = offset || 0;
  const gone = new Set(), pub = [];
  const dupIdx = Array.isArray(d && d.duplicateIdx) ? d.duplicateIdx : [];
  let acc = Array.isArray(d && d.acceptedIdx) ? d.acceptedIdx : null;
  if (!acc && d && d.ok && !((d.rejected || []).length) && !d.skipped) acc = items.slice(offset, offset + (count || items.length - offset)).map((_, i) => i);   // older worker: only trust a clean publish
  (acc || []).forEach((i) => { const it = items[offset + i]; if (it) { gone.add(it); pub.push(it); } });
  dupIdx.forEach((i) => { const it = items[offset + i]; if (it) gone.add(it); });
  pxLedgerAdd(pub.concat(dupIdx.map((i) => items[offset + i]).filter(Boolean)), label);
  const removed = pxRemoveItems(gone);
  if (dupIdx.length) pxS.hiddenPublished = (pxS.hiddenPublished || 0) + dupIdx.length;
  return { removed, published: pub.length, duplicates: dupIdx.length };
}

          subject: mainTopic, topic: mainTopic, cadre: cadre, title: label + " (extracted)", skipDuplicates: true, questions: chunk

      });
      const d = await res.json().catch(() => ({}));
      const r = pxApplyPublishResult(items, d, i, label, chunk.length);
      dups += r.duplicates;
      if (!res.ok || !d.ok) {
        pxSave(); pxRenderProg(); pxRenderReview();
        if (res.status === 409) { pxLog((d && d.error) || "Already published."); continue; }
        throw new Error((d && d.error) || ("HTTP " + res.status) + (res.status === 401 ? " (admin key does not match the NCK Worker)" : ""));

    pxSave(); pxRenderProg(); pxRenderReview();
    say((done ? "Published " + done + " questions to topic practice and removed them from the extractor." : "Nothing new was published.") + (dups ? " " + dups + " were already published and were removed." : "") + (skipped ? " " + skipped + " were refused by the server's checks and kept here so you can fix them." : "") + (done ? " They can take up to a minute to appear." : ""), !done);
  } catch (e) { say("Could not publish: " + (e && e.message ? e.message : "error") + (done ? " (" + done + " already saved before the error)" : ""), true); }
}

      <p class="px-hint">Preferred Bloom / difficulty are <b>optional last-resort</b> only if rules + AI cannot tag an item. After extract, questions are classified automatically (rules first, AI for unclear). Use <b>Classify missing tags</b> / <b>Re-classify all tags</b> in the review bar anytime.</p>
      <label for="pxFile" style="margin-top:8px">Upload PDF, Word or text file(s). You can add the answer key as a second file.</label>
      <input type="file" id="pxFile" multiple accept=".pdf,.docx,.txt,.md" onchange="pxOnFiles(this)">
      <p class="px-hint" id="pxFileStatus">${pxS.fileNotes.slice(-4).map(abEsc).join("<br>")}</p>
      <label for="pxText">…or paste the paper text here</label>
      <textarea id="pxText" onchange="pxReadForm();pxSave()" placeholder="Paste the questions (and the answer key if you have one)">${abEsc(pxS.text)}</textarea>
      <p class="px-hint">Only papers you have permission to use should be uploaded. Scanned (image-only) PDFs cannot be read; use a text version.</p>
      <div class="px-row" id="pxBtns">${pxBtnsHTML()}</div>
    </div>
    <div class="px-box"><h3>2. Progress</h3><div id="pxProg">${pxProgHTML()}</div></div>
    <div id="pxReview">${pxReviewHTML()}</div>`;
}

</script>
</body>
</html>
